        <script>
            // No-flicker theme: resolve before first paint.
            (function () {
                try {
                    var stored = localStorage.getItem("theme");
                    var theme = stored
                        ? stored
                        : window.matchMedia("(prefers-color-scheme: light)")
                              .matches
                          ? "light"
                          : "dark";
                    document.documentElement.setAttribute("data-theme", theme);
                    var meta = document.querySelector("#theme-color-meta");
                    if (meta)
                        meta.setAttribute(
                            "content",
                            theme === "light" ? "#eef0f3" : "#131518",
                        );
                } catch (e) {}
            })();
        </script>
